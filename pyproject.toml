[build-system]
requires      = ["setuptools", "wheel", "versioningit"]
build-backend = "setuptools.build_meta"


##################################################
# Generic project information
##################################################

[project]
name            = "overity"
dynamic         = ["version"]
description     = 'MLOps oriented framework for trustworthy Edge-AI'
readme          = "README.md"
requires-python = ">=3.12"
license         = "Apache-2.0"
keywords        = []

authors = [
  { name = "Florian Dupeyron", email = "florian.dupeyron@elsys-design.com" },
]

classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "parsimonious>=0.11.0",
    "plotly>=7.1.0",
    "toml>=0.10.2",
]

[project.urls]
Documentation = "https://overity.ai"
Issues        = "https://github.com/fdmysterious/overity/issues"
Source        = "https://github.com/fdmysterious/overity"


##################################################
# Project scripts and package discovery
##################################################

[project.scripts]
overity = "overity.frontend:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = {where = ["src"]}


##################################################
# Dependency groups for tooling
##################################################

[dependency-groups]

dev = [
	{include-group = "test"},
	{include-group = "lint"},
	{include-group = "docs"},
]

lint = [
	"ruff",
	"black",
]

test = [
	"pytest",
	"pytest-cov",
	"pytest-xdist"
]

docs = [
	"mkdocs",
	"mkdocs-material",
	"mkdocs-roamlinks-plugin",
	"mkdocstrings",
	"mkdocstrings[python]",
	"mkdocs-gen-files",
	"mkdocs-literate-nav"
]


##################################################
# Versioning configuration
##################################################

[tool.versioningit.format]
# Format used when there have been commits since the most recent tag:
distance = "{base_version}.post{distance}+{vcs}{rev}"
# Example formatted version: 1.2.3.post42+ge174a1f

# Format used when there are uncommitted changes:
dirty = "{base_version}+d{build_date:%Y%m%d}"
# Example formatted version: 1.2.3+d20230922

# Format used when there are both commits and uncommitted changes:
distance-dirty = "{base_version}.post{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"
# Example formatted version: 1.2.3.post42+ge174a1f.d20230922


##################################################
# Tools configuration
##################################################

## ---------------------------- Coverage

[tool.coverage.run]
source_pkgs = ["overity", "tests"]
branch      = true
parallel    = true
omit        = [
	"src/overity/__about__.py",
	"tests/*.py"
]

[tool.coverage.paths]
overity = ["src/overity"]
tests  = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

## ---------------------------- Ruff

[tool.ruff.lint]
ignore = ["BLE001"]
